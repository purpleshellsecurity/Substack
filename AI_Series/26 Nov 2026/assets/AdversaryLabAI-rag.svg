<text x="797.5" y="902" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#526575">included_in_context records selection.</text>
<text x="797.5" y="925" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#526575">No usable context → model not called.</text>
