<text x="1317.5" y="902" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#526575">filtering, quarantine and model Guardrail.</text>
<text x="1317.5" y="925" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#526575">Source validation and budget remain.</text>
