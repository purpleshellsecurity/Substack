<svg xmlns="http://www.w3.org/2000/svg" width="860" height="772" viewBox="0 0 860 772" role="img"><title>AdversaryLabAI research architecture</title><desc>Three AWS workloads and the core AWS environment send telemetry to Elastic Security Serverless.</desc><rect x="0" y="0" width="860" height="772" rx="0" fill="#FAFAFD"/><text x="42" y="65" font-family="Liberation Sans,Arial,sans-serif" font-size="51" font-weight="700" fill="#24243E">AdversaryLabAI</text><text x="44" y="104" font-family="Liberation Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#535469">AI security research on AWS</text><rect x="42" y="140" width="702" height="109" rx="15" fill="#EEEBFD"/><rect x="60" y="163" width="59" height="62" rx="13" fill="#6551C9"/><g transform="translate(73 177)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2h17l7 7v24H4z M20 2v8h8 M9 17h14 M9 23h14"/></g><text x="140" y="175" font-family="Liberation Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#24243E">Document chat</text><text x="140" y="204" font-family="Liberation Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#6551C9">Bedrock Knowledge Base</text><text x="140" y="231" font-family="Liberation Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#404156">Which passages reach the model?</text><path d="M744 194 H787" stroke="#80839B" stroke-width="3" fill="none"/><circle cx="787" cy="194" r="4.5" fill="#686D87"/><rect x="42" y="264" width="702" height="109" rx="15" fill="#E1F5F1"/><rect x="60" y="287" width="59" height="62" rx="13" fill="#16756A"/><g transform="translate(73 301)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="29" height="23" rx="5"/><path d="M16 2v5 M10 16h1 M22 16h1 M11 23h11"/></g><text x="140" y="299" font-family="Liberation Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#24243E">Customer support agent</text><text x="140" y="328" font-family="Liberation Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#16756A">AgentCore · Cedar · customer lookup</text><text x="140" y="355" font-family="Liberation Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#404156">Who can access a customer record?</text><path d="M744 318 H787" stroke="#80839B" stroke-width="3" fill="none"/><circle cx="787" cy="318" r="4.5" fill="#686D87"/><rect x="42" y="388" width="702" height="109" rx="15" fill="#FFF0E0"/><rect x="60" y="411" width="59" height="62" rx="13" fill="#AB581D"/><g transform="translate(73 425)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="m9 7-7 10 7 9 M24 7l7 10-7 9 M20 4l-7 26"/></g><text x="140" y="423" font-family="Liberation Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#24243E">MCP client and server</text><text x="140" y="452" font-family="Liberation Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#AB581D">Tool discovery · product lookup</text><text x="140" y="479" font-family="Liberation Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#404156">What does the client receive?</text><path d="M744 442 H787" stroke="#80839B" stroke-width="3" fill="none"/><circle cx="787" cy="442" r="4.5" fill="#686D87"/><rect x="42" y="512" width="702" height="109" rx="15" fill="#E5EFFC"/><rect x="60" y="535" width="59" height="62" rx="13" fill="#35689E"/><g transform="translate(73 549)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="29" height="12" rx="3"/><rect x="2" y="20" width="29" height="12" rx="3"/><path d="M8 9h1 M8 26h1 M16 9h9 M16 26h9"/></g><text x="140" y="547" font-family="Liberation Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#24243E">Core AWS environment</text><text x="140" y="576" font-family="Liberation Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#35689E">EC2 · CloudTrail · VPC Flow Logs</text><text x="140" y="603" font-family="Liberation Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#404156">What happened on the host and network?</text><path d="M744 566 H787" stroke="#80839B" stroke-width="3" fill="none"/><circle cx="787" cy="566" r="4.5" fill="#686D87"/><path d="M787 194 V640 Q787 650 777 650 H435 V670" fill="none" stroke="#686D87" stroke-width="3"/><path d="m428 667 7 10 7-10z" fill="#686D87"/><rect x="42" y="677" width="766" height="66" rx="14" fill="#282840"/><text x="64" y="719" font-family="Liberation Sans,Arial,sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">Elastic Security Serverless</text><text x="504" y="718" font-family="Liberation Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#E2E1F2">Host, cloud and application logs</text></svg>